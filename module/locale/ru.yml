any_angle: Строить стены под любым углом
any_angle_tooltip: Выберите стену и протяните её от начальной клетки до конечной.
flow: Прокладывать стены в обход препятствий
flow_tooltip: Выберите стену и протяните от начала до конца, чтобы обойти препятствия.
flow_trees: Обходить деревья
flow_trees_tooltip: Линия стены огибает деревья.
repair_only: Начало с повреждения только чинит стену
repair_only_tooltip: Начните протяжку с повреждённой клетки стены, чтобы чинить вдоль маршрута без постройки новых стен.
around_walls: Обходить свои стены
around_walls_tooltip: Линия огибает целые дружественные стены и может стыковаться с ними по краям.
cren_heights: Подстраивать высоту зубцов под соседние стены
cren_heights_tooltip: Зубцы совпадают по высоте с соседними стенами, если высота не задана в редакторе карт.
cren_attached: Требовать примыкания к проходимой стене
cren_attached_tooltip: Приподнятые зубцы проходимы, когда примыкают к проходимой стене.
walkable: Разрешить войскам переходить приподнятые зубцы
walkable_tooltip: Войска могут проходить по приподнятым зубцам.
diagonal_siege: Позволить лестницам доставать до диагональных стен
diagonal_siege_tooltip: Отдайте лестничникам обычный приказ атаки на диагональную стену.
diagonal_stuck: Освобождать юнитов, застрявших у диагональных низких стен
diagonal_stuck_tooltip: Юниты могут обходить углы диагональных низких стен.
cren_towers: Не пускать войска на башни через зубцы
cren_towers_tooltip: Для подъёма на башни рядом с зубцами войскам нужен другой путь.
stairs: Восстанавливать повреждённые лестницы при постройке поверх
stairs_tooltip: Проведите инструментом стен по повреждённым лестницам, чтобы починить их.
stairs_low: Чинить лестницы и низкими стенами
stairs_low_tooltip: Протяните низкую стену поверх повреждённых лестниц, чтобы починить их.
crenellations: Восстанавливать повреждённые зубцы при постройке поверх
crenellations_tooltip: Проведите инструментом стен по повреждённым зубцам, чтобы починить их.
low_tower_tiles: Исправить односторонние проходы рядом с башнями
low_tower_tiles_tooltip: Юниты могут проходить в обе стороны по доступным клеткам возле башен.
balance_changes: Изменения баланса
bugfixes: Исправления ошибок
qol: Удобство игры
tags.bugfixes: Исправления
tags.behavior: Поведение
