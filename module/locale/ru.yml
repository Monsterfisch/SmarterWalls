any_angle: Стены под любым углом
any_angle_tooltip: Протягиваемая стена идёт по прямой от начальной точки до конечной под любым углом. Раньше стены могли идти только ровно или под 45 градусов с изгибом посередине.
flow: Стены огибают здания
flow_tooltip: Когда на пути препятствие — здание, дерево, камни — стена огибает его по контуру и идёт дальше, вместо того чтобы становиться красной. Зубцы и лестницы делают то же самое; зубцы повторяют стену, вдоль которой их тянут.
flow_trees: Стены огибают деревья
flow_trees_tooltip: Стена обходит деревья вместо того, чтобы строиться прямо через них. Обе выбранные конечные точки остаются на месте. Требует «Стены огибают здания».
repair_only: Начало на повреждённой стене только чинит
repair_only_tooltip: Если начать тянуть стену с повреждённой клетки стены, вдоль линии ремонтируются только повреждённые клетки стены. Новые стены на пустой земле между ними или дальше не строятся.
around_walls: Стены огибают другие стены
around_walls_tooltip: Новая стена или зубец также обходит ваши целые стены, лестницы и зубцы вместо наложения на них. Она всё ещё может начинаться или заканчиваться на них для стыковки и по-прежнему проходит по повреждённым стенам для ремонта. Требует «Стены огибают здания».
cren_heights: Зубцы подстраиваются под высоту стены
cren_heights_tooltip: |-
  Зубец строится чуть выше самой высокой соседней стены, чтобы подходить к стенам на холмах и низким стенам. Соседние зубцы учитываются, только если он больше ни с чем не соприкасается. Рядом с лестницей высоту определяет соседняя ступенька (нижняя, если их две): три верхние ступеньки получают высокие зубцы, четвёртая и ниже — низкие.
cren_attached: Переходить только зубцы, примыкающие к проходимым стенам
cren_attached_tooltip: Войска могут переходить через приподнятые части зубцов, только пока те касаются стены, по которой ещё можно идти. Зубец рядом с разрушенной или сильно повреждённой стеной остаётся закрытым. Зубцы глубиной в несколько рядов (до 8) считаются единым целым. Требует «Войска могут переходить любые зубцы». В сетевой игре настройка должна совпадать у всех.
walkable: Войска могут переходить любые зубцы
walkable_tooltip: |-
  Войска могут проходить через приподнятые части зубцов — поднимаясь по лестнице или осадной башне, забираясь ассасинами или проходя мимо — а лестницы, осадные башни и ассасины могут на них взбираться, так что зубцы любой толщины больше не преграждают путь на стену. Никто не встаёт на них намеренно: приказы, построения и уступающие дорогу юниты выбирают соседнюю клетку стены, а остановившихся там сразу сдвигает туда. В сетевой игре настройка должна совпадать у всех.
ladder_wait: Секунд ожидания войск на зубце перед лестницей
ladder_wait_tooltip: Войска, ожидающие на приподнятой части зубца спуска по лестнице, могут стоять там столько времени, прежде чем их переместят на ближайшую клетку стены, после чего они продолжат путь. Просто остановившиеся там войска сдвигаются сразу.
diagonal_siege: Лестницы атакуют диагональные стены
diagonal_siege_tooltip: Лестничники могут приставлять лестницы к диагональным стенам и зубцам; раньше на диагональные стены вообще нельзя было взобраться. Направленные на такую стену войска находят место рядом со всех восьми направлений. Стыковка осадных башен (включая диагональные стены) теперь находится в Improved Siegeengines. В сетевой игре настройка должна совпадать у всех.
diagonal_stuck: Исправить застревание юнитов у низких диагональных стен
diagonal_stuck_tooltip: |-
  Исправляет старый баг игры: там, где две низкие стены соприкасаются по диагонали, а в одном углу есть наземная лестница, юниты, пытающиеся сойти с лестницы на землю в другом углу, застревали и замедляли всю игру. В сетевой игре настройка должна совпадать у всех.
cren_towers: Зубцы не ведут напрямую в башни
cren_towers_tooltip: Войска не могут пройти с зубца напрямую в башню, цитадель или ворота — только со стены или лестницы, как это работает с лестницами. Пристыкованные осадные башни по-прежнему ведут на зубцы. В сетевой игре настройка должна совпадать у всех.
stairs: Ремонт лестниц сохраняет их высоту
stairs_tooltip: Протягивание стены поверх повреждённой лестницы восстанавливает её прежний вид. Раньше она превращалась в блок высотой со стену.
stairs_low: Низкие стены тоже чинят лестницы
stairs_low_tooltip: Протягивание низкой стены поверх повреждённой лестницы восстанавливает её так же, как обычная стена. Требует «Ремонт лестниц сохраняет их высоту».
crenellations: Ремонт зубцов сохраняет их
crenellations_tooltip: Протягивание стены поверх повреждённого зубца чинит его. Только целый зубец превращается в стену, если построить стену поверх него, как и раньше.
low_tower_tiles: Убрать односторонние проходы из нижних клеток башен
low_tower_tiles_tooltip: Некоторые клетки на земле носят метку башни, например волчьи ямы вплотную к башне. Войска могли выйти с них на землю, но не вернуться, и каждая попытка проложить путь заставляла игру перестраивать все маршруты на карте, вызывая сильные тормоза. Теперь эти клетки ведут только к башням и стенам одинаково в обе стороны.
