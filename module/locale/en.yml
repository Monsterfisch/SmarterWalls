any_angle: Draw walls at any angle
any_angle_tooltip: Select a wall and drag from the start tile to the end tile.
flow: Route walls around obstacles
flow_tooltip: Select a wall and drag from start to finish to route around obstacles.
flow_trees: Go around trees
flow_trees_tooltip: The route bends around trees.
repair_only: Starting on damage repairs only
repair_only_tooltip: Start dragging on a damaged wall tile to repair along the route without building new wall.
around_walls: Go around friendly walls
around_walls_tooltip: The route bends around intact friendly walls and can still join them at the ends.
cren_heights: Match crenellation height to adjacent walls
cren_heights_tooltip: Crenellations match their neighbors unless you set their height in the map editor.
cren_attached: Require a walkable wall connection
cren_attached_tooltip: Raised crenellations are walkable when they connect to a walkable wall.
walkable: Allow troops to cross raised crenellations
walkable_tooltip: Troops can walk across raised crenellations.
diagonal_siege: Let ladders reach diagonal walls
diagonal_siege_tooltip: Give laddermen the usual attack order on a diagonal wall.
diagonal_stuck: Free units stuck at diagonal low walls
diagonal_stuck_tooltip: Units can move past the corners of diagonal low walls.
cren_towers: Keep troops from entering towers via crenellations
cren_towers_tooltip: Troops need another route onto towers next to crenellations.
stairs: Restore damaged stairs when building over them
stairs_tooltip: Use the wall tool over damaged stairs to restore them.
stairs_low: Also repair stairs with low walls
stairs_low_tooltip: Draw a low wall over damaged stairs to restore them.
crenellations: Restore damaged crenellations when building over them
crenellations_tooltip: Use the wall tool over damaged crenellations to restore them.
low_tower_tiles: Fix one-way paths beside towers
low_tower_tiles_tooltip: Units can walk both ways across accessible tiles beside towers.
