group: Smarter walls
group_descr: |
  Draw walls the way you mean them, and repair stairs and crenellations properly.
any_angle: Walls at any angle
any_angle_tooltip: |
  A wall you drag goes in a straight line from where you start to where you let go, at any
  angle. Before, walls could only run straight or at 45 degrees, with a bend in between.
flow: Walls flow around buildings
flow_tooltip: |
  When something is in the way - a building, a tree, rocks - the wall goes around it,
  hugging its shape, and carries on instead of turning red. Crenellations and stairs do the
  same; crenellations follow the wall you drag them along.
around_walls: Walls flow around other walls
around_walls_tooltip: |
  A new wall or crenellation also goes around your undamaged walls, stairs and crenellations instead of
  running over them. It can still start or end on one to join it, and it still goes over
  damaged walls so it repairs them. Needs "Walls flow around buildings".
cren_heights: Crenellations match the wall they are on
cren_heights_tooltip: |
  A crenellation is built a little taller than the tallest wall beside it, so it fits walls
  on hills and low walls. Other crenellations next to it only count when it touches nothing
  else. Next to stairs, the step right beside it decides (the lower one if it touches
  two): the top three steps get tall crenellations, step 4 and lower low ones.
walkable: Troops can cross every crenellation
walkable_tooltip: |
  Troops can walk across the raised parts of crenellations - coming up a ladder or a siege
  tower, assassins, anyone passing - and ladders and siege towers can attach to them. Nobody
  is ever sent to stand on one: an order, a formation or an idle unit making room picks the
  wall tile beside it instead, and anyone who still stops on one is moved there.
  Everyone in a multiplayer game needs the same setting.
ladder_wait: Seconds troops may wait on a crenellation for a ladder
ladder_wait_tooltip: |
  Troops waiting on a raised part of a crenellation to climb down a ladder may stay there
  this long before they are moved to the nearest wall tile; they then carry on to where
  they were going. Troops that simply stop there are moved at once.
diagonal_siege: Ladders and siege towers attack diagonal walls
diagonal_siege_tooltip: |
  Ladders and siege towers can attack walls and crenellations that run diagonally. A siege
  tower sets its corner against the diagonal wall. Before, diagonal walls could not be
  climbed at all.
  Everyone in a multiplayer game needs the same setting.
stairs: Repairing stairs keeps their height
stairs_tooltip: |
  Building a wall over damaged stairs puts the stairs back the way they were. Before, they
  turned into a block as tall as a wall.
crenellations: Repairing crenellations keeps them
crenellations_tooltip: |
  Building a wall over a damaged crenellation repairs the crenellation. Only an undamaged
  crenellation is turned into wall when you build a wall over it, as before.
