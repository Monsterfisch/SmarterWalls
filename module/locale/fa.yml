any_angle: کشیدن دیوار در هر زاویه
any_angle_tooltip: یک دیوار را انتخاب کرده و از کاشی آغاز تا کاشی پایان بکشید.
flow: گذراندن دیوارها از اطراف موانع
flow_tooltip: یک دیوار را انتخاب کرده و از ابتدا تا انتها بکشید تا از اطراف موانع بگذرد.
flow_trees: دور زدن درختان
flow_trees_tooltip: مسیر دیوار از کنار درختان خم می‌شود.
repair_only: شروع روی بخش آسیب‌دیده فقط تعمیر کند
repair_only_tooltip: کشیدن را از یک کاشی دیوار آسیب‌دیده آغاز کنید تا در طول مسیر بدون ساخت دیوار جدید فقط تعمیر شود.
around_walls: دور زدن دیوارهای خودی
around_walls_tooltip: مسیر از کنار دیوارهای خودی سالم می‌گذرد و در دو سر می‌تواند به آن‌ها وصل شود.
cren_heights: هم‌ترازی ارتفاع کنگره‌ها با دیوارهای مجاور
cren_heights_tooltip: کنگره‌ها هم‌ارتفاع دیوارهای کنار خود می‌شوند، مگر اینکه ارتفاعشان را در ویرایشگر نقشه تعیین کرده باشید.
cren_attached: الزام اتصال به دیوار قابل عبور
cren_attached_tooltip: کنگره‌های مرتفع زمانی قابل عبورند که به یک دیوار قابل عبور متصل باشند.
walkable: اجازهٔ عبور نیروها از کنگره‌های مرتفع
walkable_tooltip: نیروها می‌توانند از روی کنگره‌های مرتفع عبور کنند.
diagonal_siege: امکان تکیه دادن نردبان به دیوارهای مورب
diagonal_siege_tooltip: فرمان حملهٔ معمول را برای نردبان‌داران روی یک دیوار مورب بدهید.
diagonal_stuck: آزادسازی واحدهای گیرکرده در دیوارهای کوتاه مورب
diagonal_stuck_tooltip: واحدها می‌توانند از گوشه‌های دیوارهای کوتاه مورب عبور کنند.
cren_towers: جلوگیری از ورود نیروها به برج‌ها از طریق کنگره‌ها
cren_towers_tooltip: نیروها برای ورود به برج‌های کنار کنگره‌ها به مسیر دیگری نیاز دارند.
stairs: بازسازی پله‌های آسیب‌دیده هنگام ساخت روی آن‌ها
stairs_tooltip: ابزار دیوار را روی پله‌های آسیب‌دیده بکشید تا بازسازی شوند.
stairs_low: تعمیر پله‌ها با دیوار کوتاه نیز
stairs_low_tooltip: یک دیوار کوتاه روی پله‌های آسیب‌دیده بکشید تا بازسازی شوند.
crenellations: بازسازی کنگره‌های آسیب‌دیده هنگام ساخت روی آن‌ها
crenellations_tooltip: ابزار دیوار را روی کنگره‌های آسیب‌دیده بکشید تا بازسازی شوند.
low_tower_tiles: رفع مسیرهای یک‌طرفه در کنار برج‌ها
low_tower_tiles_tooltip: واحدها می‌توانند در هر دو جهت از کاشی‌های دسترس‌پذیر کنار برج‌ها عبور کنند.
balance_changes: تغییرات توازن
bugfixes: رفع خطاها
qol: سهولت استفاده
