any_angle: کشیدن دیوار با هر زاویه
any_angle_tooltip: دیواری که می‌کشید از نقطهٔ شروع تا نقطهٔ پایان در خط مستقیم و با هر زاویه‌ای کشیده می‌شود. پیش‌تر دیوارها فقط مستقیم یا با زاویهٔ 45 درجه و شکستگی در میانه ساخته می‌شدند.
flow: دور زدن ساختمان‌ها هنگام کشیدن دیوار
flow_tooltip: وقتی مانعی سر راه باشد — ساختمان، درخت یا صخره — دیوار به‌جای قرمز شدن، لبهٔ آن را دور می‌زند و ادامه می‌یابد. کنگره‌ها و پله‌ها نیز همین‌طورند؛ کنگره‌ها مسیر دیواری را که کنار آن کشیده می‌شوند دنبال می‌کنند.
flow_trees: دور زدن درخت‌ها هنگام کشیدن دیوار
flow_trees_tooltip: دیوار به‌جای ساختن مستقیم روی درخت‌ها، آن‌ها را دور می‌زند و دو سر انتخابی شما سر جایشان می‌مانند. نیازمند «دور زدن ساختمان‌ها هنگام کشیدن دیوار» است.
repair_only: شروع روی دیوار آسیب‌دیده فقط تعمیر می‌کند
repair_only_tooltip: اگر کشیدن دیوار را از یک خانهٔ دیوار آسیب‌دیده آغاز کنید، تنها خانه‌های آسیب‌دیدهٔ همان مسیر تعمیر می‌شوند و روی زمین خالی میانه یا ادامه دیوار جدیدی ساخته نمی‌شود.
around_walls: دور زدن سایر دیوارها
around_walls_tooltip: دیوار یا کنگرهٔ جدید دیوارها، پله‌ها و کنگره‌های سالم خودتان را نیز دور می‌زند، ولی همچنان می‌تواند برای اتصال روی آن‌ها شروع یا تمام شود و از روی دیوارهای آسیب‌دیده برای تعمیر عبور می‌کند. نیازمند «دور زدن ساختمان‌ها هنگام کشیدن دیوار» است.
cren_heights: هماهنگی ارتفاع کنگره‌ها با دیوار کناری
cren_heights_tooltip: |-
  کنگره اندکی بلندتر از بلندترین دیوار کنارش ساخته می‌شود تا با دیوارهای روی تپه و دیوارهای کوتاه هماهنگ باشد. کنگره‌های کناری فقط وقتی چیز دیگری کنارش نباشد حساب می‌شوند. کنار پله‌ها پلهٔ مجاور تعیین‌کننده است (در صورت تماس با دو پله، پلهٔ پایین‌تر): سه پلهٔ بالا کنگرهٔ بلند و از پلهٔ چهارم به پایین کنگرهٔ کوتاه می‌گیرند.
cren_attached: عبور تنها از کنگره‌های متصل به دیوار قابل تردد
cren_attached_tooltip: نیروها تنها تا زمانی می‌توانند از بخش‌های برجستهٔ کنگره عبور کنند که به دیواری قابل راه رفتن متصل باشد. کنگرهٔ کنار دیوار ویران یا به‌شدت آسیب‌دیده بسته می‌ماند. کنگره‌ای با چند ردیف عمق (تا 8 ردیف) یکپارچه حساب می‌شود. نیازمند «امکان عبور نیروها از همهٔ کنگره‌ها» است. در بازی چندنفره تنظیم همه باید یکسان باشد.
walkable: امکان عبور نیروها از همهٔ کنگره‌ها
walkable_tooltip: |-
  نیروها می‌توانند از روی بخش‌های برجستهٔ کنگره‌ها عبور کنند — هنگام بالا آمدن از نردبان یا برج محاصره، آدم‌کشان یا عبور عادی — و نردبان‌ها، برج‌های محاصره و آدم‌کشان به آن‌ها دسترسی دارند، بنابراین کنگره‌های ضخیم دیگر مانع ورود به دیوار نمی‌شوند. هیچ‌کس برای ایستادن روی آن فرستاده نمی‌شود: فرمان‌ها، آرایش‌ها و واحدهای کناررونده خانهٔ دیوار کناری را برمی‌گزینند و هر کس آنجا بایستد به کنار منتقل می‌شود. در بازی چندنفره تنظیم همه باید یکسان باشد.
diagonal_siege: حملهٔ نردبان‌ها به دیوارهای مورب
diagonal_siege_tooltip: نردبان‌ها می‌توانند به دیوارها و کنگره‌های مورب تکیه داده شوند؛ پیش‌تر دیوارهای مورب اصلاً قابل بالا رفتن نبودند. نیروهای فرستاده‌شده به چنین دیواری در هر هشت جهت جا می‌گیرند. اتصال برج‌های محاصره (از جمله دیوارهای مورب) اکنون در Improved Siegeengines است. در بازی چندنفره تنظیم همه باید یکسان باشد.
diagonal_stuck: رفع گیر کردن نیروها در دیوارهای کوتاه مورب
diagonal_stuck_tooltip: |-
  یک باگ قدیمی بازی را اصلاح می‌کند: در محل تلاقی مورب دو دیوار کوتاه با پلهٔ هم‌سطح زمین در یک گوشه، واحدهایی که می‌خواستند از پله به زمین گوشهٔ دیگر بروند گیر می‌کردند و کل بازی را کند می‌کردند. در بازی چندنفره تنظیم همه باید یکسان باشد.
cren_towers: کنگره‌ها مستقیماً به برج‌ها راه ندارند
cren_towers_tooltip: نیروها نمی‌توانند از روی کنگره مستقیماً وارد برج، دژ مرکزی یا دروازه شوند و مانند پله‌ها فقط از دیوار یا پله وارد می‌شوند. برج‌های محاصرهٔ متصل همچنان به کنگره‌ها راه دارند. در بازی چندنفره تنظیم همه باید یکسان باشد.
stairs: تعمیر پله‌ها ارتفاعشان را حفظ می‌کند
stairs_tooltip: کشیدن دیوار روی پلهٔ آسیب‌دیده آن را به شکل اولیه‌اش بازمی‌گرداند؛ پیش‌تر به بلوکی هم‌ارتفاع دیوار تبدیل می‌شد.
stairs_low: دیوارهای کوتاه نیز پله‌ها را تعمیر می‌کنند
stairs_low_tooltip: کشیدن دیوار کوتاه (چوبی) روی پلهٔ آسیب‌دیده مانند دیوار معمولی آن را بازمی‌گرداند. نیازمند «تعمیر پله‌ها ارتفاعشان را حفظ می‌کند» است.
crenellations: تعمیر کنگره‌ها آن‌ها را حفظ می‌کند
crenellations_tooltip: کشیدن دیوار روی کنگرهٔ آسیب‌دیده آن را تعمیر می‌کند. مانند قبل تنها کنگرهٔ سالم با کشیدن دیوار روی آن به دیوار تبدیل می‌شود.
low_tower_tiles: حذف مسیرهای یک‌طرفه از خانه‌های پایین برج
low_tower_tiles_tooltip: برخی خانه‌های هم‌سطح زمین نشانهٔ برج دارند، مانند گودال‌های مرگ چسبیده به برج. نیروها می‌توانستند از آن‌ها به زمین بروند اما برنگردند و هر تلاش باعث بازسازی کل مسیرهای نقشه و کندی شدید می‌شد. اکنون این خانه‌ها در هر دو جهت فقط به برج‌ها و دیوارها راه دارند.
