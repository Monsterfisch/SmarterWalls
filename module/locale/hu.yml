any_angle: Falak tetszőleges szögben
any_angle_tooltip: A húzott fal egyenes vonalban fut a kezdőponttól a végpontig, bármilyen szögben. Korábban a falak csak egyenesen vagy 45 fokban futhattak, közben töréssel.
flow: A falak megkerülik az épületeket
flow_tooltip: Ha valami útban van — épület, fa, szikla —, a fal körvonalát követve megkerüli és folytatódik ahelyett, hogy pirosra váltana. A pártázatok és lépcsők ugyanezt teszik; a pártázatok követik a falat, amely mentén húzod őket.
flow_trees: A falak megkerülik a fákat
flow_trees_tooltip: A fal megkerüli a fákat ahelyett, hogy egyenesen rajtuk keresztül épülne. A kiválasztott két végpont a helyén marad. Igényli a „A falak megkerülik az épületeket” beállítást.
repair_only: Sérült falról indítva csak javít
repair_only_tooltip: Ha egy sérült falmezőről indítod a falhúzást, csak az útvonalba eső sérült falmezők javulnak meg. A köztes vagy azon túli üres talajra nem épül új fal.
around_walls: A falak megkerülik a többi falat
around_walls_tooltip: Az új fal vagy pártázat a sértetlen saját falaidat, lépcsőidet és pártázataidat is megkerüli ahelyett, hogy rájuk épülne. Továbbra is indulhat vagy végződhet rajtuk a csatlakozáshoz, és a sérült falakon áthaladva megjavítja azokat. Igényli a „A falak megkerülik az épületeket” beállítást.
cren_heights: A pártázatok igazodnak a fal magasságához
cren_heights_tooltip: |-
  A pártázat kicsivel magasabbra épül a mellette lévő legmagasabb falnál, így illeszkedik a dombokon lévő és az alacsony falakhoz is. Más mellette lévő pártázatok csak akkor számítanak, ha semmi mással nem érintkezik. Lépcső mellett a közvetlenül szomszédos fok dönt (kettőnél az alacsonyabb): a felső három fok magas pártázatot kap, a negyediktől lefelé alacsonyat.
cren_attached: Csak járható falhoz kapcsolódó pártázatokon való átkelés
cren_attached_tooltip: A csapatok csak addig kelhetnek át a pártázat megemelt részein, amíg az egy még járható falhoz csatlakozik. A lerombolt vagy súlyosan sérült fal melletti pártázat zárva marad. A több sor mély (legfeljebb 8 soros) pártázat egyetlen egységnek számít. Igényli a „A csapatok minden pártázaton átkelhetnek” beállítást. Többjátékos módban mindenkinek azonos beállítás kell.
walkable: A csapatok minden pártázaton átkelhetnek
walkable_tooltip: |-
  A csapatok átmehetnek a pártázatok megemelt részein — létráról vagy ostromtoronyból érkezve, orgyilkosként vagy áthaladva —, és a létrák, ostromtornyok, mászó orgyilkosok is feljutnak rájuk, így a többsoros pártázat sem tartja őket távol a faltól. Senkit nem küldenek rajtuk állni: a parancsok, alakzatok és helyet adó egységek a mellette lévő falmezőt választják, aki mégis ott áll meg, oda lép át. Többjátékos módban mindenkinek azonos beállítás kell.
ladder_wait: Másodpercek, ameddig csapatok pártázaton várhatnak létrára
ladder_wait_tooltip: A létrán való lemászásra váró csapatok ennyi ideig maradhatnak a pártázat megemelt részén, mielőtt a legközelebbi falmezőre lépnek, majd onnan folytatják útjukat. Az ott csak megálló csapatok azonnal arrébb lépnek.
diagonal_siege: A létrák átlós falakat is támadnak
diagonal_siege_tooltip: A létrák átlósan futó falakra és pártázatokra is feltehetők; korábban az átlós falak egyáltalán nem voltak megmászhatók. Az ilyen falhoz küldött csapatok mind a nyolc irányban találnak helyet. Az ostromtornyok falhoz csatlakozása (átlós falakon is) már az Improved Siegeengines része. Többjátékos módban mindenkinek azonos beállítás kell.
diagonal_stuck: Alacsony átlós falaknál elakadó egységek javítása
diagonal_stuck_tooltip: |-
  Kijavít egy régi játékhibát: ahol két alacsony fal átlósan találkozik és az egyik sarokban talajon lévő lépcső van, a lépcsőről a másik sarok talajára lépni próbáló egységek elakadtak és lelassították az egész játékot. Többjátékos módban mindenkinek azonos beállítás kell.
cren_towers: A pártázatok nem vezetnek közvetlenül tornyokba
cren_towers_tooltip: A csapatok pártázatról nem léphetnek közvetlenül toronyba, vártoronyba vagy kapuházba, csak falról vagy lépcsőről, akárcsak a lépcsőknél. A falhoz csatlakozott ostromtornyok továbbra is a pártázatra vezetnek. Többjátékos módban mindenkinek azonos beállítás kell.
stairs: A lépcsők javítása megőrzi a magasságukat
stairs_tooltip: Ha sérült lépcsőre húzol falat, a lépcső az eredeti formájában áll helyre. Korábban falmagasságú tömbbé alakult.
stairs_low: Az alacsony falak is megjavítják a lépcsőket
stairs_low_tooltip: Ha alacsony (fa) falat húzol sérült lépcsőre, az ugyanúgy visszaállítja a lépcsőt, mint a rendes fal. Igényli a „A lépcsők javítása megőrzi a magasságukat” beállítást.
crenellations: A pártázatok javítása megőrzi azokat
crenellations_tooltip: Sérült pártázatra húzott fal megjavítja a pártázatot. Csak a sértetlen pártázat alakul fallá, ha falat építesz rá, mint eddig.
low_tower_tiles: Nincs egyirányú út az alacsony toronymezőkről
low_tower_tiles_tooltip: Néhány talajszinti mező toronyjelölést visel, például a torony mellé tett csapdagödrök. A csapatok ki tudtak lépni róluk a talajra, de vissza soha, és minden próbálkozás az egész térkép útvonalainak újraépítését okozta — komoly lassulással. Mostantól ezek a mezők csak tornyokhoz és falakhoz vezetnek, mindkét irányban azonosan.
