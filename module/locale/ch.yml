any_angle: 任意角度拉建城墙
any_angle_tooltip: 拖拽建造的城墙会从起点到终点按任意角度走直线。此前城墙只能走正交或 45 度方向，并在中间折弯。
flow: 城墙自动绕开建筑
flow_tooltip: 遇到障碍物（建筑、树木、岩石）时，城墙会贴着其边缘绕行并继续延伸，而不是变红无法放置。垛口和阶梯同样适用；垛口会紧贴拖拽所沿的城墙。
flow_trees: 城墙自动绕开树木
flow_trees_tooltip: 城墙会绕开树木，而不是直接穿过并铲除它们。你选定的两端位置保持不变。需要开启「城墙自动绕开建筑」。
repair_only: 从受损城墙起拉时仅执行修复
repair_only_tooltip: 当你从一格受损城墙开始拖拽城墙时，只修复沿途的受损城墙格，不会在中间或后方的空地上新建城墙。
around_walls: 城墙自动绕开其他城墙
around_walls_tooltip: 新建城墙或垛口也会绕开己方完好的城墙、阶梯和垛口，而不是覆盖上去。你仍可从其上起止以衔接城墙，并仍会经过受损城墙以进行修复。需要开启「城墙自动绕开建筑」。
cren_heights: 垛口高度自动匹配相邻城墙
cren_heights_tooltip: |-
  垛口会建得比相邻最高城墙略高一点，从而适配山地城墙和低矮城墙。只有在未接触其他建筑时才会参考相邻垛口。紧邻阶梯时由相邻的那级台阶决定（接触两级时取较低者）：最上三级台阶配高垛口，第四级及以下配低垛口。
cren_attached: 仅允许通行连接在可通行城墙上的垛口
cren_attached_tooltip: 部队只有在垛口紧邻仍可行走的城墙时才能跨越其凸起部分；紧邻已毁或严重受损城墙的孤立垛口保持封锁。需要开启「部队可跨越所有垛口」。多人联机时所有玩家设置必须一致。
walkable: 部队可跨越所有垛口
walkable_tooltip: |-
  部队可以跨过垛口的凸起部分——无论是顺云梯或攻城塔登墙、刺客攀爬还是正常经过——云梯、攻城塔和刺客也能登上垛口，使多层厚垛口不再挡住登墙。不会有人被指派停留在垛口上：移动命令、阵型和让路单位会改选旁边的城墙格，停在垛口上的单位也会被移过去。多人联机时所有玩家设置必须一致。
ladder_wait: 部队在垛口上等待云梯的秒数
ladder_wait_tooltip: 在垛口凸起处等待下云梯的部队最多可停留这么多秒，随后会被移到最近的城墙格并继续前往目的地。单纯停在上面的部队会被立即移走。
diagonal_siege: 云梯可架设在斜向城墙上
diagonal_siege_tooltip: 云梯可攻击斜向延伸的城墙和垛口；此前斜向城墙完全无法攀爬。派往此类城墙的部队可在全部八个方向找到落脚点。攻城塔搭靠（含斜墙）现已移至 Improved Siegeengines。多人联机时所有玩家设置必须一致。
diagonal_stuck: 修复单位卡在斜向矮墙处的问题
diagonal_stuck_tooltip: |-
  修复原版旧漏洞：当两段矮墙呈斜角相接且一角有贴地阶梯时，试图从阶梯走到另一角地面的单位会卡住并拖慢整局游戏。多人联机时所有玩家设置必须一致。
cren_towers: 垛口不能直接通入塔楼
cren_towers_tooltip: 部队无法从垛口直接走入塔楼、主堡或城门，只能像阶梯那样从城墙或阶梯进入。多人联机时所有玩家设置必须一致。
stairs: 修复阶梯时保持其原有高度
stairs_tooltip: 在受损阶梯上拉建城墙会将阶梯恢复原状，而不再像此前那样变成城墙高度的方块。
stairs_low: 矮墙同样可以修复阶梯
stairs_low_tooltip: 在受损阶梯上拉建矮墙（木墙）也能像普通城墙一样将其恢复原状。需要开启「修复阶梯时保持其原有高度」。
crenellations: 修复垛口时保留垛口形态
crenellations_tooltip: 在受损垛口上拉建城墙会修复垛口；只有像原版那样在完好垛口上覆盖城墙时，才会将其变为城墙。
low_tower_tiles: 消除低矮塔楼格的单向通道
low_tower_tiles_tooltip: 某些地面格子（例如紧贴塔楼的陷阱坑）带有塔楼标记。部队能从那里走到地面却无法返回，每次尝试寻路都会迫使游戏重建全图路径导致严重卡顿。现在这些格子仅双向通往塔楼与城墙。
balance_changes: 平衡性改动
bugfixes: 错误修复
qol: 体验优化
