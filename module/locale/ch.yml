any_angle: 任意角度
any_angle_tooltip: 沿任意方向拉出直墙。
flow: 绕过障碍
flow_tooltip: 拖建的墙沿建筑和岩石边缘绕行。
flow_trees: 绕过树木
flow_trees_tooltip: 绕开树木并保留两端位置。
repair_only: 只修不建
repair_only_tooltip: 从受损墙段开始拖动时，只修复受损格。
around_walls: 绕过完好城墙
around_walls_tooltip: 绕开完好的城墙和楼梯，两端仍可连接。
cren_heights: 匹配垛口高度
cren_heights_tooltip: 相邻城墙和楼梯台阶决定垛口高度。
cren_attached: 仅通过相连垛口
cren_attached_tooltip: 通过垛口需要相邻的可通行城墙。
walkable: 允许通过垛口
walkable_tooltip: 部队可穿过凸起的垛口，指令目标会落在相邻墙格。
ladder_wait: 等待梯子的时间（秒）
ladder_wait_tooltip: 超时后，等待的部队移到墙格。
diagonal_siege: 斜墙可架梯
diagonal_siege_tooltip: 梯兵可瞄准斜向城墙和垛口。
diagonal_stuck: 修复斜墙卡兵
diagonal_stuck_tooltip: 修正斜向相接的墙边楼梯和地面间的连接。
cren_towers: 经城墙或楼梯进塔
cren_towers_tooltip: 禁止从垛口直接进入塔楼、主堡或门楼。
stairs: 修复时保留台阶高度
stairs_tooltip: 受损楼梯修复后仍保留原台阶高度。
stairs_low: 低木墙也可修梯
stairs_low_tooltip: 用低矮木墙建造工具也能修复受损楼梯。
crenellations: 修复时保留垛口
crenellations_tooltip: 在受损垛口上拉墙会修复垛口。
low_tower_tiles: 修复塔旁单向通路
low_tower_tiles_tooltip: 带塔标记的低处地块仅连接到塔楼或城墙。
