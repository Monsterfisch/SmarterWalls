any_angle: 按任意角度修建城墙
any_angle_tooltip: 选择城墙并从起点地块拖拽到终点地块。
flow: 让城墙自动绕开障碍物
flow_tooltip: 选择城墙并从起点拖到终点，城墙会自动绕开障碍物。
flow_trees: 绕开树木
flow_trees_tooltip: 城墙路线会自动绕开树木。
repair_only: 从受损处起拖时仅进行修复
repair_only_tooltip: 从受损城墙地块开始拖拽，只沿途修复而不新建城墙。
around_walls: 绕开友方城墙
around_walls_tooltip: 路线会绕开完好的友方城墙，同时仍可在两端衔接。
cren_heights: 使垛口高度与相邻城墙一致
cren_heights_tooltip: 除非你在地图编辑器中指定高度，否则垛口高度自动匹配相邻城墙。
cren_attached: 需要与可通行城墙相连
cren_attached_tooltip: 抬高的垛口仅在与可通行城墙相连时才可通行。
walkable: 允许部队跨越抬高的垛口
walkable_tooltip: 部队可以步行跨过抬高的垛口。
diagonal_siege: 让云梯能够搭上斜向城墙
diagonal_siege_tooltip: 对斜向城墙向云梯兵下达常规攻击指令即可。
diagonal_stuck: 解救卡在斜向矮墙处的单位
diagonal_stuck_tooltip: 单位可以顺利绕过斜向矮墙的转角。
cren_towers: 禁止部队经由垛口登上塔楼
cren_towers_tooltip: 部队需要走其他路线才能登上紧邻垛口的塔楼。
stairs: 在受损阶梯上覆盖建造时直接修复
stairs_tooltip: 使用城墙工具拖过受损阶梯即可将其修复。
stairs_low: 也允许用矮墙修复阶梯
stairs_low_tooltip: 在受损阶梯上拉过矮墙即可将其修复。
crenellations: 在受损垛口上覆盖建造时直接修复
crenellations_tooltip: 使用城墙工具拖过受损垛口即可将其修复。
low_tower_tiles: 修复塔楼旁的单向通道
low_tower_tiles_tooltip: 单位可在塔楼旁的可通行地块上双向自由通过。
balance_changes: 平衡调整
bugfixes: 错误修复
qol: 便利性改进
tags.bugfixes: 错误修复
tags.behavior: 行为
tags.balance: 平衡
