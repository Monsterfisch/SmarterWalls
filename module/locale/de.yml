any_angle: Mauern in beliebigem Winkel
any_angle_tooltip: Eine gezogene Mauer verläuft in einer geraden Linie vom Start- bis zum Endpunkt in jedem beliebigen Winkel. Zuvor waren nur gerade oder 45-Grad-Linien mit einem Knick dazwischen möglich.
flow: Mauern führen um Gebäude herum
flow_tooltip: Steht etwas im Weg – ein Gebäude, ein Baum, Felsen –, legt sich die Mauer an dessen Kontur entlang herum und läuft weiter, statt rot zu werden. Zinnen und Treppen verhalten sich ebenso; Zinnen folgen der Mauer, an der sie entlanggezogen werden.
flow_trees: Mauern führen um Bäume herum
flow_trees_tooltip: Eine Mauer verläuft um Bäume herum, statt sie einfach zu überbauen. Die beiden gewählten Endpunkte bleiben an ihrem Platz. Erfordert „Mauern führen um Gebäude herum“.
repair_only: Start auf beschädigter Mauer repariert nur
repair_only_tooltip: Beginnst du das Ziehen einer Mauer auf einem beschädigten Mauerfeld, werden nur die beschädigten Mauerfelder entlang der Linie repariert. Auf freiem Boden dazwischen oder dahinter wird keine neue Mauer gebaut.
around_walls: Mauern führen um andere Mauern herum
around_walls_tooltip: Eine neue Mauer oder Zinne läuft auch um deine unbeschädigten Mauern, Treppen und Zinnen herum, statt über sie hinwegzubauen. Sie kann weiterhin an ihnen beginnen oder enden, um anzuschließen, und läuft weiterhin über beschädigte Mauern, um sie zu reparieren. Erfordert „Mauern führen um Gebäude herum“.
cren_heights: Zinnen passen sich der Mauerhöhe an
cren_heights_tooltip: |-
  Eine Zinne wird etwas höher gebaut als die höchste benachbarte Mauer, sodass sie zu Mauern auf Hügeln und zu niedrigen Mauern passt. Andere Zinnen daneben zählen nur, wenn sie sonst nichts berührt. Neben Treppen entscheidet die direkt anliegende Stufe (bei zweien die niedrigere): Die obersten drei Stufen erhalten hohe Zinnen, ab Stufe 4 abwärts niedrige.
cren_attached: Zinnen nur an begehbaren Mauern überqueren
cren_attached_tooltip: Truppen können die erhöhten Teile einer Zinne nur überqueren, solange diese an eine noch begehbare Mauer grenzt. Eine Zinne neben einer zerstörten oder stark beschädigten Mauer bleibt unpassierbar. Eine mehrere Reihen tiefe Zinne (bis zu 8) zählt als Ganzes. Erfordert „Truppen können jede Zinne überqueren“. Im Mehrspielermodus benötigt jeder dieselbe Einstellung.
walkable: Truppen können jede Zinne überqueren
walkable_tooltip: |-
  Truppen können über die erhöhten Teile von Zinnen hinweglaufen – beim Erklimmen über Leitern oder Belagerungstürme, als Assassinen oder beim Durchqueren –, und Leitern, Belagerungstürme sowie kletternde Assassinen erreichen sie, sodass beliebig dicke Zinnen sie nicht mehr von der Mauer fernhalten. Niemand wird dauerhaft darauf abgestellt: Befehle, Formationen und ausweichende Einheiten wählen stattdessen das angrenzende Mauerfeld, und wer dennoch dort anhält, wird dorthin versetzt. Im Mehrspielermodus benötigt jeder dieselbe Einstellung.
ladder_wait: Sekunden, die Truppen auf Zinnen auf eine Leiter warten dürfen
ladder_wait_tooltip: Truppen, die auf einer erhöhten Zinne warten, um eine Leiter hinabzusteigen, dürfen so lange bleiben, bevor sie auf das nächste Mauerfeld versetzt werden; danach setzen sie ihren Weg fort. Truppen, die dort einfach stehen bleiben, werden sofort versetzt.
diagonal_siege: Leiterträger greifen diagonale Mauern an
diagonal_siege_tooltip: Leitern können diagonal verlaufende Mauern und Zinnen angreifen; zuvor waren diagonale Mauern gar nicht erklimmbar. Truppen, die auf eine solche Mauer geschickt werden, finden in allen acht Richtungen Platz daneben. Das Andocken von Belagerungstürmen (auch an diagonalen Mauern) gehört jetzt zu Improved Siegeengines. Im Mehrspielermodus benötigt jeder dieselbe Einstellung.
diagonal_stuck: Steckengebliebene Einheiten an niedrigen diagonalen Mauern beheben
diagonal_stuck_tooltip: |-
  Behebt einen alten Spielfehler: Wo sich zwei niedrige Mauern diagonal berühren und in einer Ecke ebenerdige Treppen liegen, blieben Einheiten beim Wechsel von den Treppen zum Boden in der anderen Ecke stecken und verlangsamten das ganze Spiel. Im Mehrspielermodus benötigt jeder dieselbe Einstellung.
cren_towers: Zinnen führen nicht direkt in Türme
cren_towers_tooltip: Truppen können von einer Zinne nicht direkt in einen Turm, Bergfried oder ein Torhaus gehen, sondern nur von einer Mauer oder Treppe aus – genau wie bei Treppen. Angedockte Belagerungstürme führen weiterhin auf Zinnen. Im Mehrspielermodus benötigt jeder dieselbe Einstellung.
stairs: Reparieren von Treppen behält ihre Höhe bei
stairs_tooltip: Das Überbauen beschädigter Treppen mit einer Mauer stellt die Treppen in ihrer ursprünglichen Form wieder her. Zuvor verwandelten sie sich in einen mauerhohen Block.
stairs_low: Auch niedrige Mauern reparieren Treppen
stairs_low_tooltip: Das Überbauen beschädigter Treppen mit einer niedrigen Mauer stellt die Treppen wie bei einer normalen Mauer wieder her. Erfordert „Reparieren von Treppen behält ihre Höhe bei“.
crenellations: Reparieren von Zinnen erhält diese
crenellations_tooltip: Das Überbauen einer beschädigten Zinne mit einer Mauer repariert die Zinne. Nur eine unbeschädigte Zinne wird wie bisher zu einer Mauer, wenn man eine Mauer darüber zieht.
low_tower_tiles: Keine Einbahnwege aus niedrigen Turmfeldern
low_tower_tiles_tooltip: Manche ebenerdigen Felder tragen die Markierung eines Turms, etwa Fallgruben direkt neben einem Turm. Truppen konnten sie zum Boden hin verlassen, aber nie zurückkehren, und jeder Versuch zwang das Spiel zum Neuaufbau aller Kartenpfade – ein starkes Ruckeln. Jetzt führen diese Felder nur noch zu Türmen und Mauern, hin wie zurück identisch.
