options:
- display: GroupBox
  category: [Smarter Walls]
  header: '{{group}}'
  text: '{{group_descr}}'
  hasHeader: true
  children:
  - url: smarter-walls.anyAngle
    name: smarter-walls-any-angle
    text: '{{any_angle}}'
    tooltip: '{{any_angle_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-walls.flow
    name: smarter-walls-flow
    text: '{{flow}}'
    tooltip: '{{flow_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-walls.aroundWalls
    name: smarter-walls-around-walls
    text: '{{around_walls}}'
    tooltip: '{{around_walls_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-walls.walkableCrenellations
    name: smarter-walls-walkable-crenellations
    text: '{{walkable}}'
    tooltip: '{{walkable_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-walls.diagonalSiege
    name: smarter-walls-diagonal-siege
    text: '{{diagonal_siege}}'
    tooltip: '{{diagonal_siege_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-walls.stairs
    name: smarter-walls-stairs
    text: '{{stairs}}'
    tooltip: '{{stairs_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-walls.crenellations
    name: smarter-walls-crenellations
    text: '{{crenellations}}'
    tooltip: '{{crenellations_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
